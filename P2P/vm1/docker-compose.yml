services: #m
  c1:
    build: .
    image: mon-app-socket
    container_name: c1
    ports:
      - "5001:5000"       # Public
      - "5100-5110:5100-5110" # Réservé pour le privé
    environment:
      - MY_NAME=c1
      - MY_PUBLIC_PORT=5000
      - PRIVATE_RANGE_START=5100
      # Local : on utilise le nom du service Docker
      - ADDR_C1=c1:5001
      - ADDR_C2=c2:5002
      # On passe par l'IP pour la deuxième vm
      - ADDR_C3=192.168.200.17:5003
      - ADDR_C4=192.168.200.17:5004

  c2:
    image: mon-app-socket
    container_name: c2
    ports:
      - "5002:5000"       # Public
      - "5200-5210:5200-5210" # Réservé pour le privé
    environment:
      - MY_NAME=c2
      - MY_PUBLIC_PORT=5000
      - PRIVATE_RANGE_START=5200
      - ADDR_C1=c1:5001
      - ADDR_C2=c2:5002
      - ADDR_C3=192.168.200.17:5003
      - ADDR_C4=192.168.200.17:5004
