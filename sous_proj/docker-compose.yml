services:
  c1:
    build: .
    image: mon-app-socket
    container_name: c1
    ports:
      - "6001:5000"  # Exposition externe
    environment:
      - MY_NAME=c1
      # Local : on utilise le nom du service Docker
      - ADDR_C1=c1:5000
      - ADDR_C2=c2:5000
      # Distant : on tape sur l'IP de la VM 2
      - ADDR_C3=192.168.1.20:6003
      - ADDR_C4=192.168.1.20:6004

  c2:
    image: mon-app-socket
    container_name: c2
    ports:
      - "6002:5000" # Exposition externe
    environment:
      - MY_NAME=c2
      # Local
      - ADDR_C1=c1:5000
      - ADDR_C2=c2:5000
      # Distant
      - ADDR_C3=192.168.1.20:6003
      - ADDR_C4=192.168.1.20:6004
